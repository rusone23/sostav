<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Составы команд</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1118}
body{font-family:"Roboto Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff}
#st{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:radial-gradient(1200px 700px at 50% 0%,#1b2736,#0b1118)}
.hd{height:140px;display:flex;align-items:center;justify-content:center;position:relative}
.hd .lg{position:absolute;left:40px;top:22px;width:96px;height:96px;background:#fff;border-radius:10px;padding:6px}
.hd img{width:100%;height:100%;object-fit:contain}
.ttl{text-align:center;line-height:1}
.ttl b{font-size:62px;letter-spacing:6px}
.ttl div{font-size:30px;margin-top:10px;opacity:.75;letter-spacing:3px}
.cols{display:flex;gap:40px;padding:0 40px}
.tm{flex:1;border-radius:14px;overflow:hidden;background:#141c26;box-shadow:0 6px 24px #0008}
.th{height:104px;display:flex;align-items:center;gap:22px;padding:0 24px}
.th .l{width:84px;height:84px;background:#fff;border-radius:12px;padding:5px}
.th img{width:100%;height:100%;object-fit:contain}
.th span{font-size:56px;font-weight:800;letter-spacing:3px}
.pn{padding:10px 24px 20px}
.lab{font-size:24px;font-weight:700;letter-spacing:3px;margin:14px 0 6px;display:flex;align-items:center;gap:14px;opacity:.9}
.lab:after{content:"";flex:1;height:2px;background:currentColor;opacity:.35}
.gr{display:grid;grid-auto-flow:column;column-gap:36px}
.pl{height:54px;display:flex;align-items:center;gap:10px;font-size:27px;border-bottom:1px solid #ffffff14}
.nm{min-width:52px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px}
.fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn b{text-transform:uppercase;font-weight:700}
.fn i{font-style:normal;opacity:.8;margin-left:7px;font-size:23px}
.bd{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
</style></head><body>

function tc(h){var m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(h);var l=0.299*parseInt(m[1],16)+0.587*parseInt(m[2],16)+0.114*parseInt(m[3],16);return l>150?'#111':'#fff';}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sec(title,list,T){
  var h='<div class="lab" style="color:'+T.color+'">'+title+'</div><div class="gr" style="grid-template-rows:repeat('+Math.ceil(list.length/2)+',54px);grid-template-columns:minmax(0,1fr) minmax(0,1fr)">';
  list.forEach(function(p){
    var s=p[1].split(' ');
    h+='<div class="pl"><div class="nm" style="background:'+T.color+';color:'+tc(T.color)+'">'+p[0]+'</div><div class="fn"><b>'+esc(s[0])+'</b><i>'+esc(s.slice(1).join(' '))+'</i></div>'+
       (p[2]?'<div class="bd" style="background:#fff;color:#111">'+p[2]+'</div>':'')+'</div>';
  });
  return h+'</div>';
}
document.getElementById('lg').src=D.league;
document.getElementById('sub').textContent=D.teams[0].name+' — '+D.teams[1].name;
document.getElementById('cols').innerHTML=D.teams.map(function(T){
  return '<div class="tm"><div class="th" style="background:'+T.color+';color:'+tc(T.color)+'"><div class="l"><img src="'+T.logo+'"></div><span>'+T.name+'</span></div><div class="pn">'+
    sec('НАПАДАЮЩИЕ',T.f,T)+sec('ЗАЩИТНИКИ',T.d,T)+sec('ВРАТАРИ',T.g,T)+'</div></div>';
}).join('');
